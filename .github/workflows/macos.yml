name: macOS checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-audit:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Build source tools and verify Release isolation and Testing lifecycle
        shell: bash
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          if bash scripts/verify-macos.sh 2>&1 | tee "$RUNNER_TEMP/agentdevkit-verification.log"; then
            exit 0
          fi
          detail=$(grep -E 'error:|Error:|Traceback|AssertionError|requires Swift' "$RUNNER_TEMP/agentdevkit-verification.log" | tail -n 8 || true)
          if [[ -z "$detail" ]]; then
            detail=$(tail -n 8 "$RUNNER_TEMP/agentdevkit-verification.log")
          fi
          detail=${detail//%/%25}
          detail=${detail//$'\r'/%0D}
          detail=${detail//$'\n'/%0A}
          echo "::error title=macOS verification failed::$detail"
          exit 1
